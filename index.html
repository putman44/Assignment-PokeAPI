<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeAPI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="mx-auto" style="width: 420px">
      <div class="card my-5 p-2">
        <div class="mb-3">
          <label for="pokemon-name" class="form-label"
            >Enter the name of the pokemon you would like to see.</label
          >
          <div class="input-group">
            <input
              type="text"
              class="form-control"
              id="basic-url"
              placeholder="Squirtle"
              aria-describedby="basic-addon3 basic-addon4"
            />
          </div>
        </div>

        <button onclick="fetchPokemon()" class="btn btn-primary">
          Fetch Pokemon
        </button>
      </div>
    </div>

    <div id="pokemon-container" class="col-6 mx-auto d-none">
      <div class="row border rounded-3">
        <img id="pokemon-img" src="" class="col-4" alt="..." />
        <div id="pokemon-card" class="col-8">
          <p class="card-text">
            Some quick example text to build on the card title and make up the
            bulk of the card’s content.
          </p>
        </div>
      </div>
    </div>

    <script src="index.js"></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
